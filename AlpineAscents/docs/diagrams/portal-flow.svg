<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" role="img" aria-labelledby="title desc">
  <title id="title">Alpine Ascents visitor journey flowchart</title>
  <desc id="desc">A visitor opens the responsive portal, sees shared navigation and live visitor information, chooses a learning, club, preparation or media section, and continues exploring.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#62776d"/>
    </marker>
    <style>
      text{font-family:"DM Sans",Arial,sans-serif;fill:#18332e}
      .title{font-size:26px;font-weight:700;fill:#fff}
      .subtitle{font-size:14px;fill:#dfe9dc}
      .label{font-size:14px;font-weight:700}
      .small{font-size:12px;fill:#51655d}
      .line{fill:none;stroke:#62776d;stroke-width:2;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect width="1200" height="600" rx="18" fill="#f5f3e9"/>
  <path d="M18 0h1164a18 18 0 0 1 18 18v68H0V18A18 18 0 0 1 18 0Z" fill="#18332e"/>
  <text x="38" y="42" class="title">Alpine Ascents | Visitor journey</text>
  <text x="38" y="67" class="subtitle">How visitors move from the home page to useful mountain information</text>

  <rect x="36" y="258" width="130" height="72" rx="16" fill="#18332e"/>
  <text x="101" y="288" class="label" text-anchor="middle" fill="#fff">Visitor</text>
  <text x="101" y="310" class="small" text-anchor="middle" fill="#dfe9dc">opens the portal</text>
  <path class="line" d="M166 294h38"/>

  <rect x="210" y="246" width="190" height="96" rx="14" fill="#e9f0e9" stroke="#287565" stroke-width="2"/>
  <text x="305" y="278" class="label" text-anchor="middle">Responsive SPA</text>
  <text x="305" y="301" class="small" text-anchor="middle">Shared header, navigation,</text>
  <text x="305" y="319" class="small" text-anchor="middle">page content and ticker</text>
  <path class="line" d="M400 294h38"/>

  <rect x="444" y="246" width="185" height="96" rx="14" fill="#e9f0e9" stroke="#287565" stroke-width="2"/>
  <text x="536" y="278" class="label" text-anchor="middle">Visitor information</text>
  <text x="536" y="301" class="small" text-anchor="middle">Visitor count plus live</text>
  <text x="536" y="319" class="small" text-anchor="middle">date, time and location</text>
  <path class="line" d="M629 294h40"/>

  <path d="M741 228 800 294l-59 66-59-66Z" fill="#d6e89a" stroke="#78933e" stroke-width="2"/>
  <text x="741" y="289" class="label" text-anchor="middle">Choose</text>
  <text x="741" y="308" class="label" text-anchor="middle">a section</text>

  <path class="line" d="M800 294h28v-132h28"/>
  <path class="line" d="M800 294h56"/>
  <path class="line" d="M800 294h28v132h28"/>
  <path class="line" d="M800 294h28v218h28"/>

  <rect x="862" y="119" width="270" height="82" rx="14" fill="#fff" stroke="#287565" stroke-width="2"/>
  <text x="997" y="148" class="label" text-anchor="middle">Learn about mountaineering</text>
  <text x="997" y="172" class="small" text-anchor="middle">History, styles, skills, shelter and hazards</text>

  <rect x="862" y="253" width="270" height="82" rx="14" fill="#fff" stroke="#287565" stroke-width="2"/>
  <text x="997" y="282" class="label" text-anchor="middle">Find a mountain community</text>
  <text x="997" y="306" class="small" text-anchor="middle">Search clubs and explore the map</text>

  <rect x="862" y="387" width="270" height="82" rx="14" fill="#fff" stroke="#287565" stroke-width="2"/>
  <text x="997" y="416" class="label" text-anchor="middle">Prepare for a trip</text>
  <text x="997" y="440" class="small" text-anchor="middle">Use general guidance and gear checklist</text>

  <rect x="862" y="473" width="270" height="82" rx="14" fill="#fff" stroke="#287565" stroke-width="2"/>
  <text x="997" y="502" class="label" text-anchor="middle">Explore stories and media</text>
  <text x="997" y="526" class="small" text-anchor="middle">Gallery, trip reports and latest updates</text>

  <path class="line" d="M1132 160h30v350h-24"/>
  <path class="line" d="M1132 294h24"/>
  <path class="line" d="M1132 428h30v-42h-24"/>
  <rect x="1000" y="556" width="165" height="30" rx="15" fill="#18332e"/>
  <text x="1082" y="576" class="small" text-anchor="middle" fill="#fff">Continue exploring</text>
</svg>
